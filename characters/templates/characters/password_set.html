{% extends "characters/base.html" %}
{% block content %}
<h1>Set your password</h1>
{% if validlink %}
<form class="form" method="post">
  {% csrf_token %}
  {{ form.as_div }}
  <div class="actions"><button type="submit">Set password</button></div>
</form>
{% else %}
<p class="warn">This link is invalid or has already been used.</p>
{% endif %}
{% endblock %}
