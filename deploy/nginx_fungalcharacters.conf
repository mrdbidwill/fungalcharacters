# fungalcharacters.org — nginx on the shared Hostinger VPS (installed to /etc/nginx/sites-available/fungalcharacters).
# The app runs in Docker on 127.0.0.1:8030 (docker-compose.prod.yml).

# Port 80: certificate renewals, then everything to https://fungalcharacters.org
server {
    listen 80;
    listen [::]:80;
    server_name fungalcharacters.org www.fungalcharacters.org fungalcharacters.com www.fungalcharacters.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://fungalcharacters.org$request_uri; }
}

# www and .com: redirect to the main address
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.fungalcharacters.org fungalcharacters.com www.fungalcharacters.com;
    ssl_certificate     /etc/letsencrypt/live/fungalcharacters.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fungalcharacters.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://fungalcharacters.org$request_uri;
}

# The site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fungalcharacters.org;
    ssl_certificate     /etc/letsencrypt/live/fungalcharacters.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fungalcharacters.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5m;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
