# Production (on the VPS): docker compose -f docker-compose.prod.yml up -d --build
# Secrets come from .env (never in git; see .env.example).
# The project name must be explicit: the code folder is /home/fc/app, and gulfcoastfungi already runs as
# Compose project "app" on the same server. Without this name, `up` would replace gulfcoastfungi's containers.
name: fungalcharacters
services:
  db:
    image: postgres:17
    # Only the database password comes from .env (Compose reads .env for ${...}), so editing the app's
    # settings in .env no longer restarts the database.
    environment:
      POSTGRES_DB: fungalcharacters
      POSTGRES_USER: fungalcharacters
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fungalcharacters -d fungalcharacters"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  web:
    build: .
    user: "10001"   # unprivileged user inside the container
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      DATABASE_HOST: db
      DATABASE_NAME: fungalcharacters
      DATABASE_USER: fungalcharacters
    ports:
      - "127.0.0.1:8030:8000"   # nginx on the host proxies to this; gulfcoastfungi uses 8010, mrdbid.com 8020
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:   # the app's own logs (requests, warnings): capped, then overwritten (privacy page)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pgdata:
